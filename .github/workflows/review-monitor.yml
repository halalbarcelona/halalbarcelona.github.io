name: Review monitor

on:
  schedule:
    # Every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r tools/review-monitor/requirements.txt

      - name: Run review monitor
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GBP_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GBP_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GBP_REFRESH_TOKEN }}
          GBP_ACCOUNT_ID: ${{ secrets.GBP_ACCOUNT_ID }}
          GBP_LOCATION_ID: ${{ secrets.GBP_LOCATION_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.NOTIFY_FROM_EMAIL }}
          EMAIL_APP_PASSWORD: ${{ secrets.NOTIFY_FROM_EMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_TO_EMAIL }}
        run: python tools/review-monitor/review_monitor.py

      - name: Commit updated state
        run: |
          git config user.name "review-monitor-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- tools/review-monitor/state.json; then
            git add tools/review-monitor/state.json
            git commit -m "chore: update review monitor state"
            git push
          fi
